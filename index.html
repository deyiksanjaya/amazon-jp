        function getUniqueSnackImage() {
            const candidates = snackImages.filter(img => !recentImages.includes(img));
            const chosen = candidates.length > 0 
                ? candidates[Math.floor(Math.random() * candidates.length)]
                : snackImages[Math.floor(Math.random() * snackImages.length)];
            
            recentImages.push(chosen);
            if (recentImages.length > 10) {
                recentImages.shift();
            }
            return chosen;
        }

        function renderStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalf = rating % 1 >= 0.4;
            let starsHtml = '';
            for (let i = 0; i < 5; i++) {
                if (i < fullStars) {
                    starsHtml += '<i class="fa-solid fa-star text-amazon-orange text-sm"></i>';
                } else if (i === fullStars && hasHalf) {
                    starsHtml += '<i class="fa-solid fa-star-half-stroke text-amazon-orange text-sm"></i>';
                } else {
                    starsHtml += '<i class="fa-regular fa-star text-amazon-orange text-sm"></i>';
                }
            }
            return starsHtml;
        }

        function getFilteredPool() {
            return snackProducts.filter(product => {
                const search = internalSearchQuery.trim().toLowerCase();
                return search === '' || product.title.toLowerCase().includes(search);
            });
        }

            loadMoreProducts();

                        <div class="mt-1 flex items-baseline">
                            <span data-product-id="${product.id}" class="text-amazon-price text-xl font-medium">¥${product.price.toLocaleString('ja-JP')}</span>
                            <span class="home-unit-${product.id} text-gray-500 text-[11px] ml-1">(¥${product.price.toLocaleString('ja-JP')}/個)</span>
                        </div>

                        <div class="flex items-center text-[11px] mt-1">
                            <span class="text-blue-500 font-bold italic mr-1">prime</span>
                            <span class="text-gray-600">翌日</span>
                        </div>
                        <p class="text-[11px] text-gray-900 mt-0.5">無料配送 <span class="font-bold">${deliveryStr}</span> にお届け</p>

                        <button 
                            onclick="addToCart('${product.id}', '${displayImage}')" 
                            class="mt-3 w-full bg-amazon-yellow hover:bg-yellow-400 text-gray-900 text-sm font-medium py-2 rounded-full shadow-sm active:scale-[0.98] transition"
                        >
                            カートに入れる
                        </button>
                    </div>
                `;
                fragment.appendChild(card);
            }

            inner.appendChild(fragment);
            renderedCount += BATCH_SIZE;
            isLoadingInfinite = false;
        }

        function handleInfiniteScroll(container) {
            if (isLoadingInfinite) return;
            if (container.scrollHeight - container.scrollTop - container.clientHeight < 600) {
                isLoadingInfinite = true;
                loadMoreProducts();
            }
        }

        function handleSearch(val) {
            if (val === 'snack' && internalSearchQuery === '') return;
            internalSearchQuery = val;
            initProductList();
        }

        function resetSearch() {
            document.getElementById('search-input').value = '';
            internalSearchQuery = '';
            initProductList();
        }

        function toggleWishlist(btn) {
            const icon = btn.querySelector('i');
            if (icon.classList.contains('fa-regular')) {
                icon.classList.replace('fa-regular', 'fa-solid');
                icon.classList.add('text-red-500');
                showToast('リストに追加しました');
            } else {
                icon.classList.replace('fa-solid', 'fa-regular');
                icon.classList.remove('text-red-500');
                showToast('リストから削除しました');
            }
        }

        function addToCart(productId, customImage) {
            const product = snackProducts.find(p => p.id === productId);
            if (!product) return;
            const existing = cart.find(item => item.id === productId && item.image === customImage);
            
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, image: customImage, qty: 1 });
            }
            
            lastAddedProductId = productId;
            updateCartUI();
            showToast('カートに追加しました');
        }

        function updateCartQty(productId, delta) {
            const index = cart.findIndex(item => item.id === productId);
            if (index > -1) {
                cart[index].qty += delta;
                if (cart[index].qty <= 0) cart.splice(index, 1);
            }
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const totalItems = cart.reduce((acc, curr) => acc + curr.qty, 0);
            
            if (totalItems > 0) {
                badge.innerText = totalItems;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
            renderCartItems();
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items-container');
            const subtotalEl = document.getElementById('cart-subtotal');

            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-500 text-sm">カートに商品がありません</div>`;
                subtotalEl.innerText = '¥0';
                return;
            }

            const targetTotal = 764;
            const rawTotals = cart.map(item => item.price * item.qty);
            const rawSum = rawTotals.reduce((a, b) => a + b, 0);

            let itemsWithAllocated = cart.map((item, index) => {
                const rawLine = rawTotals[index];
                const idealLine = rawSum > 0 ? (rawLine / rawSum) * targetTotal : targetTotal / cart.length;
                const floorLine = Math.floor(idealLine);
                const remainder = idealLine - floorLine;
                return {
                    ...item,
                    cartIndex: index,
                    allocatedLine: floorLine,
                    remainder: remainder
                };
            });

            let currentSum = itemsWithAllocated.reduce((acc, curr) => acc + curr.allocatedLine, 0);
            let diff = targetTotal - currentSum;

            const sortedByRemainder = [...itemsWithAllocated].sort((a, b) => b.remainder - a.remainder);
            for (let i = 0; i < diff; i++) {
                sortedByRemainder[i].allocatedLine += 1;
            }

            const finalCartItems = itemsWithAllocated.map(item => {
                const allocated = sortedByRemainder.find(s => s.cartIndex === item.cartIndex);
                if (cart[item.cartIndex]) {
                    cart[item.cartIndex].lastAllocatedPrice = allocated.allocatedLine;
                }
                return allocated;
            });

            container.innerHTML = finalCartItems.map(item => {
                const unitPriceDetail = item.qty > 1 
                    ? `<span class="text-[10px] text-gray-500 ml-1">(¥${Math.round(item.allocatedLine / item.qty)}/個)</span>` 
                    : '';
                return `
                    <div class="flex py-2">
                        <img src="${item.image}" class="w-20 h-20 object-contain border border-gray-200 rounded p-1" onerror="this.src='https://placehold.co/100x100'">
                        <div class="ml-3 flex-1">
                            <h4 class="text-xs font-medium text-gray-900 line-clamp-2">${item.title}</h4>
                            <div class="text-amazon-price font-bold text-sm mt-1">
                                ¥${item.allocatedLine.toLocaleString('ja-JP')}
                                ${unitPriceDetail}
                            </div>
                            <div class="flex items-center mt-2 border border-gray-300 rounded shadow-sm w-max bg-gray-50">
                                <button onclick="updateCartQty('${item.id}', -1)" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded-l text-gray-600">-</button>
                                <span class="px-3 text-sm bg-white">${item.qty}</span>
                                <button onclick="updateCartQty('${item.id}', 1)" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded-r text-gray-600">+</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            subtotalEl.innerText = `¥${targetTotal.toLocaleString('ja-JP')}`;
        }

        function openCartDrawer() {
            renderCartItems();

            document.getElementById('cart-drawer').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('cart-drawer-content').classList.remove('translate-y-full');

            clearTimeout(priceChangeTimeout);
            priceChangeTimeout = setTimeout(() => {
                if (!lastAddedProductId || cart.length === 0) return;
                
                const cartItem = cart.find(item => item.id === lastAddedProductId);
                if (!cartItem || cartItem.lastAllocatedPrice === undefined) return;

                const newManipulatedPrice = cartItem.lastAllocatedPrice;

                const snackProd = snackProducts.find(p => p.id === lastAddedProductId);
                if (snackProd) {
                    snackProd.price = newManipulatedPrice;
                }

                const homePriceEls = document.querySelectorAll(`[data-product-id="${lastAddedProductId}"]`);
                homePriceEls.forEach(el => {
                    el.innerText = `¥${newManipulatedPrice.toLocaleString('ja-JP')}`;
                });

                const unitEls = document.querySelectorAll(`.home-unit-${lastAddedProductId}`);
                unitEls.forEach(el => {
                    el.innerText = `(¥${newManipulatedPrice.toLocaleString('ja-JP')}/個)`;
                });
            }, 500); 
        }

        function closeCartDrawer() {
            document.getElementById('cart-drawer-content').classList.add('translate-y-full');
            setTimeout(() => {
                document.getElementById('cart-drawer').classList.add('opacity-0', 'pointer-events-none');
            }, 300);
        }

        function checkout() {
            if (cart.length === 0) return;
            showToast('ご注文ありがとうございます！');
            cart = [];
            updateCartUI();
            closeCartDrawer();
        }

        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        window.onload = initProductList;
    </script>
</body>
</html>
