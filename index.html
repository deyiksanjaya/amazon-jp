    <!-- Debug Utils -->
    <script>
        window.debugLog = function(message) {
            console.log(message);
            const consoleEl = document.getElementById('debug-console');
            if (!consoleEl) return;
            const logLine = document.createElement('div');
            const now = new Date();
            const timeStr = `${now.getHours()}:${now.getMinutes()}:${now.getSeconds()}.${now.getMilliseconds()}`;
            logLine.innerText = `[${timeStr}] ${message}`;
            consoleEl.appendChild(logLine);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        };
    </script>

    <!-- Firebase Remote Control -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDrzoRgLQQYf7l9yctMGOttEKYbZSH6-p8",
            authDomain: "e-comerce-force.firebaseapp.com",
            databaseURL: "https://e-comerce-force-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "e-comerce-force",
            storageBucket: "e-comerce-force.firebasestorage.app",
            messagingSenderId: "514683280786",
            appId: "1:514683280786:web:915dcf56b2056c7847354b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        signInAnonymously(auth).then(() => {
            window.debugLog('Firebase Auth Success.');
            const forceRef = ref(db, 'forceConfig');
            
            onValue(forceRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    window.isNumberForceActive = (data.numberForce === 'active');
                    
                    const newItemForceValue = data.itemForce;
                    let parsedTarget = parseInt(newItemForceValue, 10);
                    
                    if (!isNaN(parsedTarget) && parsedTarget > 0) {
                        window.isItemForceActive = true;
                        
                        if (window.targetSwipeCount !== parsedTarget) {
                            window.targetSwipeCount = parsedTarget;
                            window.currentSwipeCount = 0;
                            window.mainSwipeDirection = 0; 
                            window.isForcedItemInjected = false;
                            window.debugLog(`ItemForce Active! Target swipes: ${window.targetSwipeCount}`);
                        }
                    } else {
                        window.isItemForceActive = false;
                        window.targetSwipeCount = 0;
                        window.currentSwipeCount = 0;
                        window.mainSwipeDirection = 0;
                        window.debugLog('ItemForce Inactive!');
                    }
                }
            }, (error) => {
                window.debugLog(`DB Error: ${error.message}`);
            });
        }).catch((error) => {
            window.debugLog(`Auth Error: ${error.message}`);
        });
    </script>

        function getUniqueSnackImage() {
            const candidates = snackImages.filter(img => !recentImages.includes(img));
            const chosen = candidates.length > 0 
                ? candidates[Math.floor(Math.random() * candidates.length)]
                : snackImages[Math.floor(Math.random() * snackImages.length)];
            
            recentImages.push(chosen);
            if (recentImages.length > 10) {
                recentImages.shift();
            }
            return chosen;
        }

        function renderStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalf = rating % 1 >= 0.4;
            let starsHtml = '';
            for (let i = 0; i < 5; i++) {
                if (i < fullStars) starsHtml += '<i class="fa-solid fa-star text-amazon-orange text-sm"></i>';
                else if (i === fullStars && hasHalf) starsHtml += '<i class="fa-solid fa-star-half-stroke text-amazon-orange text-sm"></i>';
                else starsHtml += '<i class="fa-regular fa-star text-amazon-orange text-sm"></i>';
            }
            return starsHtml;
        }

        function getFilteredPool() {
            return snackProducts; 
        }

        function initProductList() {
            renderedCount = 0;
            recentImages = [];
            window.isForcedItemInjected = false;
            document.getElementById('product-list-inner').innerHTML = '';
            loadMoreProducts();
            loadMoreProducts();
        }

        function loadMoreProducts() {
            const pool = getFilteredPool();
            const emptyState = document.getElementById('empty-state');
            const inner = document.getElementById('product-list-inner');

            if (pool.length === 0) {
                inner.innerHTML = '';
                emptyState.classList.remove('hidden');
                isLoadingInfinite = false;
                return;
            }

            emptyState.classList.add('hidden');
            const fragment = document.createDocumentFragment();

        function pdpTouchStart(e) {
            if (isAnimatingPDP) return;
            pdpTouchStartX = e.changedTouches[0].screenX;
            pdpTouchStartY = e.changedTouches[0].screenY;
            isValidTouch = true; // Tandai bahwa titik awal terekam dengan sukses
        }

        function pdpTouchMove(e) { 
            // Biarkan scroll vertikal bawaan browser berjalan
        }

        function pdpTouchEnd(e) {
            // Tolak sentuhan jika animasi sedang berjalan ATAU touchstart tidak valid (tertutup animasi sebelumnya)
            if (isAnimatingPDP || !isValidTouch) return;
            
            isValidTouch = false; // Reset validitas untuk usapan berikutnya
            
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            
            const dx = touchEndX - pdpTouchStartX;
            const dy = touchEndY - pdpTouchStartY;
            
            // Evaluasi dominan swipe horizontal (dx lebih besar dari dy)
            if (Math.abs(dx) > Math.abs(dy) * 1.5 && Math.abs(dx) > 50) {
                if (dx < 0) {
                    navigatePDP(1); // Swipe ke Kiri -> Arah 1 (Next)
                } else {
                    navigatePDP(-1); // Swipe ke Kanan -> Arah -1 (Prev)
                }
            }
        }

        function navigatePDP(direction) {
            isAnimatingPDP = true;
            let pool = getFilteredPool();
            let targetProduct, targetImage;
            
            let nextIndex = (currentPdpIndex + direction + pool.length) % pool.length;

            if (window.isItemForceActive && !window.isForcedItemInjected && window.targetSwipeCount > 0) {
                
                // 1. Kunci Insting Arah Pertama
                if (window.mainSwipeDirection === 0) {
                    window.mainSwipeDirection = direction;
                }

                // 2. Evaluasi Arah Swipe Saat Ini vs Arah Insting
                if (direction === window.mainSwipeDirection) {
                    window.currentSwipeCount++; // Searah insting utama = Tambah
                } else {
                    window.currentSwipeCount--; // Berlawanan arah insting = Kurangi
                }

                window.debugLog(`Swipe! Dir: ${direction}, Main: ${window.mainSwipeDirection}, Count: ${window.currentSwipeCount}/${window.targetSwipeCount}`);

                // 3. Cek pencapaian Target
                if (window.currentSwipeCount === window.targetSwipeCount) {
                    // Siapkan Item Paksaan (Fujiya Milky Pie)
                    targetProduct = {
                        id: 'jp-forced',
                        title: '不二家 ミルキーパイ ペコちゃん 濃厚ミルククリーム 菓子 パイ',
                        category: 'sweet',
                        rating: 4.9,
                        reviews: 1850,
                        price: 320, // Harga dikembalikan ke harga wajar di bawah max price 450
                        store: '不二家 (Fujiya)'
                    };
                    targetImage = 'IMG_3567.jpeg';

                    // Sisipkan ke array
                    let insertIndex = direction > 0 ? currentPdpIndex + 1 : currentPdpIndex;
                    snackProducts.splice(insertIndex, 0, targetProduct);
                    
                    window.isForcedItemInjected = true;
                    window.debugLog(`🎯 Target Reached! Forced item injected at index ${insertIndex}`);
                    
                    pool = getFilteredPool();
                    currentPdpIndex = pool.findIndex(p => p.id === 'jp-forced');
                } else {
                    currentPdpIndex = nextIndex;
                    targetProduct = pool[currentPdpIndex];
                    targetImage = getUniqueSnackImage();
                }
            } else {
                currentPdpIndex = nextIndex;
                targetProduct = pool[currentPdpIndex];
                targetImage = (targetProduct.id === 'jp-forced') ? 'IMG_3567.jpeg' : getUniqueSnackImage();
            }

            currentPdpProduct = targetProduct;
            currentPdpImage = targetImage;

            const container = document.getElementById('pdp-slide-container');
            const scrollArea = document.getElementById('pdp-scroll-area');
            
            // Animasi Keluar (Slide saja, tanpa opacity)
            container.style.transition = 'transform 0.2s ease-in';
            container.style.transform = direction > 0 ? 'translateX(-100%)' : 'translateX(100%)';

            setTimeout(() => {
                // UPDATE DOM DIBELAKANG LAYAR
                renderPDPContent(currentPdpProduct, currentPdpImage);
                scrollArea.scrollTop = 0; // Reset scroll setiap ganti barang
                
                container.style.transition = 'none';
                container.style.transform = direction > 0 ? 'translateX(100%)' : 'translateX(-100%)';
                void container.offsetWidth; // Paksa reflow DOM
                
                // Animasi Masuk
                container.style.transition = 'transform 0.25s ease-out';
                container.style.transform = 'translateX(0)';
                
                setTimeout(() => {
                    isAnimatingPDP = false;
                }, 250);
            }, 200);
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items-container');
            const subtotalEl = document.getElementById('cart-subtotal');

            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-500 text-sm">カートに商品がありません</div>`;
                subtotalEl.innerText = '¥0';
                return;
            }

            if (!isNumberForceActive) {
                const rawSum = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
                
                container.innerHTML = cart.map(item => {
                    const lineTotal = item.price * item.qty;
                    const unitPriceDetail = item.qty > 1 
                        ? `<span class="text-[10px] text-gray-500 ml-1">(¥${item.price.toLocaleString('ja-JP')}/個)</span>` 
                        : '';
                    return `
                        <div class="flex py-2">
                            <img src="${item.image}" class="w-20 h-20 object-contain border border-gray-200 rounded p-1" onerror="this.src='https://placehold.co/100x100'">
                            <div class="ml-3 flex-1">
                                <h4 class="text-xs font-medium text-gray-900 line-clamp-2">${item.title}</h4>
                                <div class="text-amazon-price font-bold text-sm mt-1">
                                    ¥${lineTotal.toLocaleString('ja-JP')}
                                    ${unitPriceDetail}
                                </div>
                                <div class="flex items-center mt-2 border border-gray-300 rounded shadow-sm w-max bg-gray-50">
                                    <button onclick="updateCartQty('${item.id}', -1)" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded-l text-gray-600">-</button>
                                    <span class="px-3 text-sm bg-white min-w-[24px] text-center">${item.qty}</span>
                                    <button onclick="updateCartQty('${item.id}', 1)" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded-r text-gray-600">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                subtotalEl.innerText = `¥${rawSum.toLocaleString('ja-JP')}`;
                return;
            }

            // --- Number Force Logic ---
            const targetTotal = 1746; // Target baru (1746 yen)
            const minPrice = 250; // Harga minimal per unit
            const maxPrice = 450; // Harga maksimal per unit (450 yen)
            
            const rawTotals = cart.map(item => item.price * item.qty);
            const rawSum = rawTotals.reduce((a, b) => a + b, 0);
            const totalQty = cart.reduce((a, b) => a + b.qty, 0);

            // Keamanan sistem: Menyesuaikan min/max sementara jika target tidak masuk akal 
            // dengan jumlah barang di keranjang (menghindari error/hang).
            let safeMin = minPrice;
            let safeMax = maxPrice;
            if (targetTotal < totalQty * minPrice) safeMin = Math.floor(targetTotal / totalQty);
            if (targetTotal > totalQty * maxPrice) safeMax = Math.ceil(targetTotal / totalQty);

            // Jatah harga dasar untuk setiap unit
            const remainingTarget = targetTotal - (totalQty * safeMin);

            let itemsWithAllocated = cart.map((item, index) => {
                const rawLine = rawTotals[index];
                
                // Distribusikan sisa target secara proporsional dari harga aslinya
                const idealRemaining = rawSum > 0 ? (rawLine / rawSum) * remainingTarget : remainingTarget / cart.length;
                
                // Batasi penambahan harga agar tidak melebihi batas safeMax
                const maxAllowedAdd = (safeMax - safeMin) * item.qty;
                const actualAdd = Math.min(idealRemaining, maxAllowedAdd);
                
                const floorAdd = Math.floor(actualAdd);
                const remainder = actualAdd - floorAdd;
                
                return {
                    ...item,
                    cartIndex: index,
                    allocatedLine: (safeMin * item.qty) + floorAdd, 
                    remainder: remainder,
                    spaceLeft: maxAllowedAdd - floorAdd // Sisa ruang sebelum mentok harga maksimal
                };
            });

            let currentSum = itemsWithAllocated.reduce((acc, curr) => acc + curr.allocatedLine, 0);
            let diff = targetTotal - currentSum;

            // Urutkan berdasarkan sisa desimal terbesar
            let sortedByRemainder = [...itemsWithAllocated].sort((a, b) => b.remainder - a.remainder);
            
            // Bagikan sisa selisih (diff) pecahan 1 yen ke item yang belum mentok batas max
            while (diff > 0) {
                let addedInThisLoop = false;
                for (let i = 0; i < sortedByRemainder.length; i++) {
                    if (diff > 0 && sortedByRemainder[i].spaceLeft > 0) {
                        sortedByRemainder[i].allocatedLine += 1;
                        sortedByRemainder[i].spaceLeft -= 1;
                        diff -= 1;
                        addedInThisLoop = true;
                    }
                }
                // Paksaan terakhir: jika semua item mentok batas Max tapi target belum tercapai
                if (!addedInThisLoop) {
                    sortedByRemainder[0].allocatedLine += diff;
                    diff = 0; 
                }
            }

            const finalCartItems = itemsWithAllocated.map(item => {                
                const allocated = sortedByRemainder.find(s => s.cartIndex === item.cartIndex);
                if (cart[item.cartIndex]) {
                    cart[item.cartIndex].lastAllocatedPrice = allocated.allocatedLine;
                }
                return allocated;
            });

            container.innerHTML = finalCartItems.map(item => {
                const unitPriceDetail = item.qty > 1 
                    ? `<span class="text-[10px] text-gray-500 ml-1">(¥${Math.round(item.allocatedLine / item.qty)}/個)</span>` 
                    : '';
                return `
                    <div class="flex py-2">
                        <img src="${item.image}" class="w-20 h-20 object-contain border border-gray-200 rounded p-1" onerror="this.src='https://placehold.co/100x100'">
                        <div class="ml-3 flex-1">
                            <h4 class="text-xs font-medium text-gray-900 line-clamp-2">${item.title}</h4>
                            <div class="text-amazon-price font-bold text-sm mt-1">
                                ¥${item.allocatedLine.toLocaleString('ja-JP')}
                                ${unitPriceDetail}
                            </div>
                            <div class="flex items-center mt-2 border border-gray-300 rounded shadow-sm w-max bg-gray-50">
                                <button onclick="updateCartQty('${item.id}', -1)" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded-l text-gray-600">-</button>
                                <span class="px-3 text-sm bg-white min-w-[24px] text-center">${item.qty}</span>
                                <button onclick="updateCartQty('${item.id}', 1)" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded-r text-gray-600">+</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            subtotalEl.innerText = `¥${targetTotal.toLocaleString('ja-JP')}`;
        }

        function openCartDrawer() {
            renderCartItems();
            document.getElementById('cart-drawer').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('cart-drawer-content').classList.remove('translate-y-full');

            if (isNumberForceActive) {

                priceChangeTimeout = setTimeout(() => {
                    if (!lastAddedProductId || cart.length === 0) return;
                    
                    const cartItem = cart.find(item => item.id === lastAddedProductId);
                    if (!cartItem || cartItem.lastAllocatedPrice === undefined) return;

                    const newManipulatedPrice = cartItem.lastAllocatedPrice;
                    const snackProd = snackProducts.find(p => p.id === lastAddedProductId);
                    if (snackProd) {
                        snackProd.price = newManipulatedPrice;
                    }

                    const homePriceEls = document.querySelectorAll(`[data-product-id="${lastAddedProductId}"]`);
                    homePriceEls.forEach(el => {
                        el.innerText = `¥${newManipulatedPrice.toLocaleString('ja-JP')}`;
                    });

                    const pdpPriceEls = document.querySelectorAll(`[data-pdp-price="${lastAddedProductId}"]`);
                    pdpPriceEls.forEach(el => {
                        el.innerText = newManipulatedPrice.toLocaleString('ja-JP');
                    });
                }, 500); 
            }

        function checkout() {
            if (cart.length === 0) return;
            showToast('ご注文ありがとうございます！');
            cart = [];
            updateCartUI();
            closeCartDrawer();
        }

        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        window.onload = initProductList;
    </script>
</body>
</html>
