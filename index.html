<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Japan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        },
                        amazon: {
                            teal: '#a2e8dd',
                            darkTeal: '#008296',
                            yellow: '#f3a847',
                            orange: '#e47911',
                            lightBg: '#f7f8f8'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased min-h-screen flex justify-center items-start sm:py-6">

    <!-- Main Device Wrapper -->
    <div class="w-full max-w-md bg-white h-screen sm:h-[844px] sm:max-h-[920px] sm:rounded-3xl sm:shadow-2xl flex flex-col relative overflow-hidden border-gray-200 sm:border">
        
        <!-- Fixed Header Area (Search Bar + Category Bar) -->
        <div class="flex-none z-20 bg-white shadow-xs">
            <!-- Top App Header / Search Bar Bar -->
            <div class="bg-gradient-to-r from-[#b3f3e6] via-[#a6edd8] to-[#92e2d4] px-3 py-2.5 flex items-center space-x-2 shadow-sm">
                <!-- Back Button -->
                <button onclick="resetSearch()" class="p-1.5 text-gray-800 hover:bg-black/5 rounded-full transition" title="戻る">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </button>

                <!-- Search Input Wrapper -->
                <div class="flex-1 bg-white rounded-lg px-3 py-1.5 flex items-center shadow-inner border border-gray-300">
                    <i class="fa-solid fa-magnifying-glass text-gray-500 text-base mr-2"></i>
                    <input 
                        type="text" 
                        id="search-input" 
                        value="スナック" 
                        placeholder="スナック・お菓子を検索..." 
                        class="w-full bg-transparent border-none outline-none text-sm font-medium text-gray-900 placeholder-gray-400"
                        oninput="handleSearch(this.value)"
                    >
                    <!-- Clear Button -->
                    <button id="clear-search" onclick="clearSearch()" class="text-gray-400 hover:text-gray-600 mr-2 text-xs">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <!-- Visual Search Lens Icon -->
                    <button class="text-gray-500 hover:text-gray-700 px-1 text-sm mr-1.5" title="カメラ検索">
                        <i class="fa-regular fa-square-plus text-base"></i>
                    </button>
                    <!-- Voice Search Icon -->
                    <button class="text-gray-500 hover:text-gray-700 text-sm" title="音声検索">
                        <i class="fa-solid fa-microphone text-base"></i>
                    </button>
                </div>
            </div>

            <!-- Quick Category Bar -->
            <div class="bg-white border-b border-gray-200 px-3 py-2 flex space-x-2 overflow-x-auto no-scrollbar scroll-smooth text-xs">
                <button onclick="filterCategory('all', this)" class="cat-btn bg-gray-900 text-white px-3 py-1.5 rounded-full font-medium whitespace-nowrap shadow-xs">すべて</button>
                <button onclick="filterCategory('chips', this)" class="cat-btn bg-gray-100 text-gray-700 hover:bg-gray-200 px-3 py-1.5 rounded-full font-medium whitespace-nowrap">ポテトチップス</button>
                <button onclick="filterCategory('sweet', this)" class="cat-btn bg-gray-100 text-gray-700 hover:bg-gray-200 px-3 py-1.5 rounded-full font-medium whitespace-nowrap">チョコ・甘味</button>
                <button onclick="filterCategory('senbei', this)" class="cat-btn bg-gray-100 text-gray-700 hover:bg-gray-200 px-3 py-1.5 rounded-full font-medium whitespace-nowrap">せんべい・米菓</button>
                <button onclick="filterCategory('savory', this)" class="cat-btn bg-gray-100 text-gray-700 hover:bg-gray-200 px-3 py-1.5 rounded-full font-medium whitespace-nowrap">おつまみ・珍味</button>
                <button onclick="filterCategory('gummy', this)" class="cat-btn bg-gray-100 text-gray-700 hover:bg-gray-200 px-3 py-1.5 rounded-full font-medium whitespace-nowrap">グミ・キャンディ</button>
            </div>
        </div>

        <!-- Infinite Scrollable Product List Container -->
        <div class="flex-1 overflow-y-auto bg-white divide-y divide-gray-100" id="product-container" onscroll="handleInfiniteScroll(this)">
            <!-- Product items rendered dynamically via JS -->
            <div id="product-list-inner" class="divide-y divide-gray-100"></div>
        </div>

        <!-- Empty Search State Container -->
        <div id="empty-state" class="hidden flex-1 flex flex-col items-center justify-center p-8 text-center">
            <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-3 text-gray-400">
                <i class="fa-solid fa-cookie-bite text-3xl"></i>
            </div>
            <h3 class="font-semibold text-gray-800 text-base">お菓子が見つかりませんでした</h3>
            <p class="text-xs text-gray-500 mt-1">「ポテト」、「チョコ」、「抹茶」などのキーワードをお試しください。</p>
            <button onclick="resetSearch()" class="mt-4 bg-amber-400 hover:bg-amber-500 text-gray-900 text-xs px-4 py-2 rounded-lg font-medium shadow-sm transition">すべてのスナックを表示</button>
        </div>

        <!-- Fixed Bottom Navigation Bar -->
        <div class="flex-none bg-white border-t border-gray-200 flex justify-around items-center py-2 px-1 z-20">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-amazon-darkTeal font-medium text-[10px] w-1/4 py-1">
                <i class="fa-solid fa-house text-xl mb-0.5"></i>
                <span>ホーム</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-gray-500 hover:text-gray-800 text-[10px] w-1/4 py-1">
                <i class="fa-regular fa-user text-xl mb-0.5"></i>
                <span>マイページ</span>
            </button>
            <button onclick="openCartDrawer()" id="nav-cart" class="flex flex-col items-center text-gray-500 hover:text-gray-800 text-[10px] w-1/4 py-1 relative">
                <div class="relative">
                    <i class="fa-solid fa-cart-shopping text-xl mb-0.5"></i>
                    <span id="cart-badge" class="hidden absolute -top-1.5 -right-2 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full min-w-[16px] text-center">0</span>
                </div>
                <span>カート</span>
            </button>
            <button onclick="switchTab('menu')" id="nav-menu" class="flex flex-col items-center text-gray-500 hover:text-gray-800 text-[10px] w-1/4 py-1">
                <i class="fa-solid fa-bars text-xl mb-0.5"></i>
                <span>メニュー</span>
            </button>
        </div>

        <!-- Product Detail Drawer Modal -->
        <div id="product-modal" class="fixed inset-0 bg-black/50 z-50 flex justify-end flex-col opacity-0 pointer-events-none transition-opacity duration-300">
            <div id="product-modal-content" class="bg-white rounded-t-2xl max-h-[85vh] overflow-y-auto p-4 transform translate-y-full transition-transform duration-300">
                <div class="flex justify-between items-center mb-2">
                    <span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded" id="modal-category">プレミアムスナック</span>
                    <button onclick="closeProductModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                
                <div class="flex justify-center py-2">
                    <img id="modal-image" src="" alt="スナック詳細" class="h-48 object-contain rounded-lg">
                </div>

                <h2 id="modal-title" class="font-bold text-gray-900 text-base leading-snug mt-2"></h2>
                
                <div class="flex items-center space-x-2 mt-1">
                    <div class="flex text-amber-400 text-xs" id="modal-stars"></div>
                    <span id="modal-rating" class="text-xs text-blue-600 font-medium"></span>
                </div>

                <div class="my-3 flex items-baseline space-x-2">
                    <span id="modal-price" class="text-2xl font-bold text-gray-900"></span>
                    <span class="text-xs text-green-600 font-semibold" id="modal-delivery">本日お届け可能</span>
                </div>

                <p id="modal-desc" class="text-xs text-gray-600 leading-relaxed border-t border-b border-gray-100 py-3 my-2"></p>

                <div class="flex items-center justify-between my-4">
                    <div class="flex items-center border border-gray-300 rounded-lg">
                        <button onclick="adjustModalQty(-1)" class="px-3 py-1 text-gray-600 hover:bg-gray-100 font-bold">-</button>
                        <span id="modal-qty" class="px-3 py-1 font-semibold text-sm">1</span>
                        <button onclick="adjustModalQty(1)" class="px-3 py-1 text-gray-600 hover:bg-gray-100 font-bold">+</button>
                    </div>
                    <button id="modal-add-btn" onclick="addModalItemToCart()" class="flex-1 ml-3 bg-amber-400 hover:bg-amber-500 text-gray-900 font-semibold py-2.5 px-4 rounded-xl text-sm shadow flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-cart-plus"></i>
                        <span>カートに追加する</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Shopping Cart Drawer -->
        <div id="cart-drawer" class="fixed inset-0 bg-black/50 z-50 flex justify-end flex-col opacity-0 pointer-events-none transition-opacity duration-300">
            <div id="cart-drawer-content" class="bg-white rounded-t-2xl max-h-[85vh] h-[80vh] flex flex-col transform translate-y-full transition-transform duration-300">
                <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50 rounded-t-2xl">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-bag-shopping text-amazon-darkTeal text-lg"></i>
                        <h3 class="font-bold text-gray-800 text-base">ショッピングカート</h3>
                    </div>
                    <button onclick="closeCartDrawer()" class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-600 hover:bg-gray-300">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- Cart Items List -->
                <div id="cart-items-container" class="flex-1 overflow-y-auto p-4 space-y-3 divide-y divide-gray-100">
                    <!-- Cart items rendered dynamically -->
                </div>

                <!-- Cart Footer Summary -->
                <div class="p-4 border-t border-gray-200 bg-white space-y-3">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-gray-500">小計</span>
                        <span id="cart-subtotal" class="font-bold text-gray-900 text-base">¥0</span>
                    </div>
                    <div class="flex justify-between items-center text-xs text-gray-500">
                        <span>配送料 (全国一律)</span>
                        <span class="text-green-600 font-semibold">無料</span>
                    </div>
                    <button onclick="checkout()" class="w-full bg-amber-400 hover:bg-amber-500 text-gray-900 font-bold py-3 rounded-xl shadow text-sm transition flex items-center justify-center space-x-2">
                        <span>レジに進む</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="fixed top-14 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white text-xs px-4 py-2.5 rounded-full shadow-lg z-50 flex items-center space-x-2 opacity-0 pointer-events-none transition-all duration-300">
            <i class="fa-solid fa-circle-check text-green-400 text-sm" id="toast-icon"></i>
            <span id="toast-message">商品をカートに追加しました</span>
        </div>

    </div>

        // Sliding window history buffer to enforce distance of at least 10 items without image repetition
        let recentImages = [];

        function getUniqueSnackImage() {
            const candidates = snackImages.filter(img => !recentImages.includes(img));
            const chosen = candidates.length > 0 
                ? candidates[Math.floor(Math.random() * candidates.length)]
                : snackImages[Math.floor(Math.random() * snackImages.length)];

            recentImages.push(chosen);
            if (recentImages.length > 10) {
                recentImages.shift();
            }
            return chosen;
        }

        // Render Star Ratings
        function renderStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalf = rating % 1 >= 0.4;
            let starsHtml = '';

            for (let i = 0; i < 5; i++) {
                if (i < fullStars) {
                    starsHtml += '<i class="fa-solid fa-star text-amazon-yellow text-xs mr-0.5"></i>';
                } else if (i === fullStars && hasHalf) {
                    starsHtml += '<i class="fa-solid fa-star-half-stroke text-amazon-yellow text-xs mr-0.5"></i>';
                } else {
                    starsHtml += '<i class="fa-regular fa-star text-gray-300 text-xs mr-0.5"></i>';
                }
            }
            return starsHtml;
        }

        // Get filtered products pool based on current search & category
        function getFilteredPool() {
            return snackProducts.filter(product => {
                const matchesCat = activeCategory === 'all' || product.category === activeCategory;
                const matchesSearch = product.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      product.description.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });
        }

        // Reset and re-initialize product list
        function initProductList() {
            renderedCount = 0;
            recentImages = []; // Reset sliding window history on reset/filter
            const inner = document.getElementById('product-list-inner');
            inner.innerHTML = '';
            loadMoreProducts();
            loadMoreProducts();
        }

        // Load next batch of products seamlessly with endless rolling loop
        function loadMoreProducts() {
            const pool = getFilteredPool();
            const emptyState = document.getElementById('empty-state');
            const inner = document.getElementById('product-list-inner');

            if (pool.length === 0) {
                inner.innerHTML = '';
                emptyState.classList.remove('hidden');
                isLoadingInfinite = false;
                return;
            }

            emptyState.classList.add('hidden');

            const fragment = document.createDocumentFragment();

            for (let i = 0; i < BATCH_SIZE; i++) {
                // Rolling index modulo pool length so it loops endlessly
                const rawIndex = renderedCount + i;
                const poolIndex = rawIndex % pool.length;
                const product = pool[poolIndex];

                // Dynamically pick image ensuring distance >= 10 list items
                const displayImage = getUniqueSnackImage();

                const card = document.createElement('div');
                card.className = 'flex p-3 sm:p-4 bg-white hover:bg-gray-50/80 transition duration-150 cursor-pointer';
                card.onclick = () => openProductModal(product.id, displayImage);

                card.innerHTML = `

        // Detect container scroll far ahead to append items seamlessly without lag
        function handleInfiniteScroll(container) {
            if (isLoadingInfinite) return;
            const scrollBottom = container.scrollHeight - container.scrollTop - container.clientHeight;
            // Preload 800px before bottom so user never encounters an end or loading indicator
            if (scrollBottom < 800) {
                isLoadingInfinite = true;
                loadMoreProducts();
            }
        }

        function handleSearch(val) {
            searchQuery = val.trim();
            const clearBtn = document.getElementById('clear-search');
            if (searchQuery.length > 0) {

            } else {
                clearBtn.classList.add('hidden');
            }
            initProductList();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            handleSearch('');

            document.getElementById('search-input').value = 'スナック';

            initProductList();
        }

        // Wishlist Toggle
        function toggleWishlist(btn) {
            const icon = btn.querySelector('i');
            if (icon.classList.contains('fa-regular')) {
                icon.classList.remove('fa-regular', 'text-gray-300');
                icon.classList.add('fa-solid', 'text-red-500');
                showToast('お気に入りに追加しました');
            } else {
                icon.classList.remove('fa-solid', 'text-red-500');
                icon.classList.add('fa-regular', 'text-gray-300');
                showToast('お気に入りから削除しました');
            }
        }

        // Product Modal Logic
        function openProductModal(productId, overrideImage = null) {
            const product = snackProducts.find(p => p.id === productId);
            if (!product) return;

            selectedProductModal = { ...product };
            if (overrideImage) {
                selectedProductModal.displayImage = overrideImage;
            } else {
                selectedProductModal.displayImage = product.image;
            }
            modalQuantity = 1;

            document.getElementById('modal-title').innerText = product.title;
            document.getElementById('modal-image').src = selectedProductModal.displayImage;
            document.getElementById('modal-category').innerText = product.category.toUpperCase();
            document.getElementById('modal-stars').innerHTML = renderStars(product.rating);
            document.getElementById('modal-rating').innerText = `${product.rating} (${product.reviews} 件のレビュー)`;
            document.getElementById('modal-price').innerText = `¥${product.price.toLocaleString('ja-JP')}`;
            document.getElementById('modal-delivery').innerText = product.delivery;
            document.getElementById('modal-desc').innerText = product.description;
            document.getElementById('modal-qty').innerText = modalQuantity;

            const modal = document.getElementById('product-modal');
            const modalContent = document.getElementById('product-modal-content');
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('translate-y-full');
        }

        function closeProductModal() {
            const modal = document.getElementById('product-modal');
            const modalContent = document.getElementById('product-modal-content');

            modalContent.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('opacity-0', 'pointer-events-none');
            }, 200);
        }

        function adjustModalQty(delta) {
            modalQuantity = Math.max(1, modalQuantity + delta);
            document.getElementById('modal-qty').innerText = modalQuantity;
        }

        function addModalItemToCart() {
            if (selectedProductModal) {
                for (let i = 0; i < modalQuantity; i++) {
                    addToCart(selectedProductModal.id, false, selectedProductModal.displayImage);
                }
                showToast(`${modalQuantity}個の「${selectedProductModal.title.substring(0, 12)}...」をカートに追加`);
                closeProductModal();
            }
        }

        // Cart Logic
        function addToCart(productId, notify = true, customImage = null) {
            const product = snackProducts.find(p => p.id === productId);
            if (!product) return;

            const itemImage = customImage || product.image;
            const existingIndex = cart.findIndex(item => item.id === productId && item.image === itemImage);
            
            if (existingIndex > -1) {
                cart[existingIndex].qty += 1;
            } else {
                cart.push({ ...product, image: itemImage, qty: 1 });
            }

            updateCartUI();
            if (notify) {
                showToast('商品をカートに追加しました');
            }
        }

        function updateCartQuantity(productId, delta) {
            const index = cart.findIndex(item => item.id === productId);
            if (index > -1) {
                cart[index].qty += delta;
                if (cart[index].qty <= 0) {
                    cart.splice(index, 1);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const totalItems = cart.reduce((acc, curr) => acc + curr.qty, 0);

            if (totalItems > 0) {
                badge.innerText = totalItems;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            renderCartItems();
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items-container');
            const subtotalEl = document.getElementById('cart-subtotal');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center py-12">
                        <i class="fa-solid fa-basket-shopping text-gray-300 text-4xl mb-2"></i>
                        <p class="text-sm font-medium text-gray-500">カートに商品が入っていません</p>
                    </div>
                `;
                subtotalEl.innerText = '¥0';
                return;
            }

            // Target total always 764
            const targetTotal = 764;
            const rawTotals = cart.map(item => item.price * item.qty);
            const rawSum = rawTotals.reduce((a, b) => a + b, 0);

            // Proportionally divide 764 Yen among items in cart
            let itemsWithAllocated = cart.map((item, index) => {
                const rawLine = rawTotals[index];
                const idealLine = rawSum > 0 ? (rawLine / rawSum) * targetTotal : targetTotal / cart.length;
                const floorLine = Math.floor(idealLine);
                const remainder = idealLine - floorLine;
                return {
                    ...item,
                    cartIndex: index,
                    allocatedLine: floorLine,
                    remainder: remainder
                };
            });

            // Distribute remaining yen to reach exact total of 764
            let currentSum = itemsWithAllocated.reduce((acc, curr) => acc + curr.allocatedLine, 0);
            let diff = targetTotal - currentSum;

            const sortedByRemainder = [...itemsWithAllocated].sort((a, b) => b.remainder - a.remainder);
            for (let i = 0; i < diff; i++) {
                sortedByRemainder[i].allocatedLine += 1;
            }

            // Map back to original cart order
            const finalCartItems = itemsWithAllocated.map(item => {
                return sortedByRemainder.find(s => s.cartIndex === item.cartIndex);
            });

            container.innerHTML = finalCartItems.map(item => {
                const unitPriceDetail = item.qty > 1 
                    ? `<span class="text-[10px] text-gray-400 font-normal ml-1">(¥${Math.round(item.allocatedLine / item.qty)} × ${item.qty})</span>` 
                    : '';
                return `
                    <div class="flex items-center justify-between pt-3 pb-1">
                        <div class="flex items-center space-x-3 flex-1">
                            <img src="${item.image}" class="w-12 h-12 object-contain rounded bg-gray-50 p-1 border border-gray-100">
                            <div class="flex-1 pr-2">
                                <h4 class="text-xs font-semibold text-gray-800 line-clamp-1">${item.title}</h4>
                                <div class="flex items-center space-x-1 mt-0.5">
                                    <span class="text-xs text-amber-600 font-bold">¥${item.allocatedLine.toLocaleString('ja-JP')}</span>
                                    ${unitPriceDetail}
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="flex items-center border border-gray-300 rounded text-xs">
                                <button onclick="updateCartQuantity('${item.id}', -1)" class="px-2 py-0.5 text-gray-600 hover:bg-gray-100 font-bold">-</button>
                                <span class="px-2 font-semibold text-gray-800">${item.qty}</span>
                                <button onclick="updateCartQuantity('${item.id}', 1)" class="px-2 py-0.5 text-gray-600 hover:bg-gray-100 font-bold">+</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            subtotalEl.innerText = `¥${targetTotal.toLocaleString('ja-JP')}`;
        }

        function openCartDrawer() {
            renderCartItems();
            const drawer = document.getElementById('cart-drawer');
            const drawerContent = document.getElementById('cart-drawer-content');
            
            drawer.classList.remove('opacity-0', 'pointer-events-none');
            drawerContent.classList.remove('translate-y-full');
        }

        function closeCartDrawer() {
            const drawer = document.getElementById('cart-drawer');
            const drawerContent = document.getElementById('cart-drawer-content');

            drawerContent.classList.add('translate-y-full');
            setTimeout(() => {
                drawer.classList.add('opacity-0', 'pointer-events-none');
            }, 200);
        }

        function checkout() {
            if (cart.length === 0) {
                showToast('カートが空です');
                return;
            }
            showToast('ご注文ありがとうございます！');
            cart = [];
            updateCartUI();
            closeCartDrawer();
        }

        // Toast Helper
        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const messageEl = document.getElementById('toast-message');
            
            messageEl.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Tab Switching Navigation
        function switchTab(tabName) {
            const navs = ['home', 'profile', 'cart', 'menu'];
            navs.forEach(nav => {
                const el = document.getElementById(`nav-${nav}`);
                if (el) {
                    if (nav === tabName && nav !== 'cart') {
                        el.classList.add('text-amazon-darkTeal');
                        el.classList.remove('text-gray-500');
                    } else if (nav !== 'cart') {
                        el.classList.remove('text-amazon-darkTeal');
                        el.classList.add('text-gray-500');
                    }
                }
            });

            if (tabName === 'profile') {
                showToast('マイページを開きました');
            } else if (tabName === 'menu') {
                showToast('カテゴリー・メニュー');
            }
        }

        // Initialization on Load
        window.onload = function() {
            initProductList();
        };
    </script>
</body>
</html>
